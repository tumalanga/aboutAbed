name: Update Forex Pickle

on:
  schedule:
    - cron: '15 9 * * *'  # Runs daily at 5:15 PM Taiwan time
  workflow_dispatch:

jobs:
  update-pickle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy kagglehub

      - name: Run conversion script
        run: python ForExUp.py

      - name: Commit and push updated pickle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          PICKLE="./streamlit/assets/rates.pkl"
          echo "Checking contents of assets folder:"
          ls -l ./streamlit/assets/

          if [ -f "$PICKLE" ]; then
              echo "Pickle file exists. Adding and committing..."
              git add -f "$PICKLE"
              git diff --cached --quiet || git commit -m "Update rates.pkl automatically on $(date)"
              git push
              echo "✅ Pickle committed successfully!"
          else
              echo "❌ Pickle file does not exist, skipping commit."
              exit 1
          fi
