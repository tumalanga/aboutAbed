name: Keep Streamlit App Alive (8-min ping)

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

# jobs:
#   ping:
#     runs-on: ubuntu-latest
#     steps:
#     - name: Ping Streamlit App with Logging
#       run: |
#         curl -s -o /dev/null -w "%{http_code}" https://abtabed.streamlit.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit with redirect details
        run: |
          echo "=== $(date) ==="
          echo "Start pinging Streamlit app with full redirect chain..."

          curl -s -D - -A "Mozilla/5.0" https://abtabed.streamlit.app -o /dev/null | grep -Ei "HTTP/|Location:"
